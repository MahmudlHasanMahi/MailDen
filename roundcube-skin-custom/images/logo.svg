<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Sunlight Gradient -->
    <linearGradient id="bgSunlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EC" />
      <stop offset="40%" stop-color="#FFE4C4" />
      <stop offset="100%" stop-color="#E8A87C" />
    </linearGradient>

    <!-- Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C86D32" />
      <stop offset="50%" stop-color="#A44E19" />
      <stop offset="100%" stop-color="#6E300B" />
    </linearGradient>

    <!-- Wood Highlight -->
    <linearGradient id="woodHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFA86E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A44E19" stop-opacity="0" />
    </linearGradient>

    <!-- Green Rug Gradient -->
    <linearGradient id="rugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#054A38" />
      <stop offset="100%" stop-color="#022B21" />
    </linearGradient>

    <!-- Fur Ginger Gradient -->
    <linearGradient id="gingerFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39A59" />
      <stop offset="50%" stop-color="#E27D38" />
      <stop offset="100%" stop-color="#B8531A" />
    </linearGradient>

    <!-- Fur Cream/White Gradient -->
    <linearGradient id="whiteFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F3EC" />
      <stop offset="100%" stop-color="#E3DAC9" />
    </linearGradient>

    <!-- Tabby Stripe Color -->
    <linearGradient id="darkStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42281D" />
      <stop offset="100%" stop-color="#1F1009" />
    </linearGradient>

    <!-- Pink Inner Ear/Nose Gradient -->
    <linearGradient id="pinkEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB7B2" />
      <stop offset="100%" stop-color="#E77F78" />
    </linearGradient>
    
    <radialGradient id="sunGlow" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFE0B2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFE0B2" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2D1500" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgSunlight)" />

  <!-- Wooden Ledge in Background -->
  <path d="M -20 180 L 820 180 L 820 340 L -20 380 Z" fill="url(#woodGrad)" />
  <path d="M -20 180 L 820 180 L 820 200 L -20 200 Z" fill="url(#woodHighlight)" />
  <path d="M -20 340 L 820 340 L 820 380 L -20 380 Z" fill="#421C06" opacity="0.4" />

  <!-- Green Patterned Woven Rug (Bottom Left) -->
  <g id="green-mat">
    <path d="M -20 480 L 520 820 L -20 820 Z" fill="url(#rugGrad)" filter="url(#softShadow)"/>
    <!-- Geometric Pattern Lines -->
    <g fill="none" stroke="#E0F2F1" stroke-width="4" opacity="0.85">
      <path d="M -10 520 L 100 630 L -10 740" />
      <path d="M 60 490 L 210 640 L 60 790" />
      <path d="M 130 480 L 320 670 L 130 820" />
      <path d="M 220 480 L 430 690 L 220 820" />
      <path d="M -10 680 L 180 490" />
      <path d="M -10 780 L 300 480" />
      <path d="M 80 820 L 410 490" />
      <path d="M 200 820 L 490 530" />
      <polygon points="100,560 130,590 100,620 70,590" fill="#E0F2F1" opacity="0.6" stroke="none"/>
      <polygon points="200,610 230,640 200,670 170,640" fill="#E0F2F1" opacity="0.6" stroke="none"/>
      <polygon points="100,690 130,720 100,750 70,720" fill="#E0F2F1" opacity="0.6" stroke="none"/>
      <polygon points="300,660 330,690 300,720 270,690" fill="#E0F2F1" opacity="0.6" stroke="none"/>
    </g>
  </g>

  <!-- CAT GROUP -->
  <g id="sleeping-cat" filter="url(#softShadow)">

    <!-- Main Body & Back Fur -->
    <path d="M 320 380 C 450 320 620 350 720 450 C 810 540 820 720 820 820 L 300 820 C 350 750 360 650 350 580 C 340 500 300 430 320 380 Z" fill="url(#gingerFur)" />

    <!-- White Underbelly & Chest Fluff -->
    <path d="M 280 440 C 340 460 380 520 400 600 C 420 680 440 760 450 820 L 220 820 C 200 780 180 720 220 640 C 250 580 250 490 280 440 Z" fill="url(#whiteFur)" />

    <!-- Fluffy Back Fur Calico Patches -->
    <path d="M 500 380 C 600 390 700 460 760 550 C 810 630 810 750 800 820 L 620 820 C 680 750 720 650 670 560 C 630 490 540 430 500 380 Z" fill="#E27D38" />
    <path d="M 580 440 C 660 480 740 560 780 660 L 720 820 L 640 820 C 680 740 650 620 580 540 Z" fill="#D2691E" opacity="0.7"/>

    <!-- Dark Tabby Stripes on Back -->
    <g fill="url(#darkStripe)">
      <path d="M 460 395 C 490 420 510 460 500 490 C 490 460 470 430 445 410 Z" />
      <path d="M 510 415 C 550 445 570 500 550 540 C 540 490 520 450 490 425 Z" />
      <path d="M 570 450 C 620 490 640 550 620 600 C 600 550 580 500 545 465 Z" />
      <path d="M 630 500 C 680 550 710 630 680 700 C 670 630 640 560 605 520 Z" />
      <path d="M 690 570 C 740 630 760 710 730 770 C 720 710 690 640 665 590 Z" />
    </g>

    <!-- EXTENDED FRONT LEG & PAW -->
    <g id="extended-paw">
      <path d="M 20 610 C 120 540 280 550 380 610 C 350 630 250 650 150 660 C 80 665 20 640 20 610 Z" fill="#021C16" opacity="0.4" />
      <path d="M -10 560 C 40 530 120 510 220 530 C 300 545 360 570 410 610 C 380 640 310 645 220 635 C 130 625 40 620 -10 600 Z" fill="url(#whiteFur)" />
      <path d="M 30 545 C 100 525 180 525 260 540 C 330 555 380 580 400 605 C 360 620 290 625 210 615 C 130 605 50 600 30 580 Z" fill="#E8D8C3" opacity="0.6"/>

      <!-- Tabby Rings on Arm -->
      <g fill="url(#darkStripe)">
        <path d="M 330 560 C 350 570 365 588 370 605 C 355 598 340 588 320 575 Z" />
        <path d="M 280 545 C 305 560 320 585 325 610 C 310 600 290 585 270 565 Z" />
        <path d="M 230 535 C 255 550 270 580 275 608 C 260 595 240 575 220 555 Z" />
        <path d="M 180 530 C 205 545 220 575 222 605 C 208 590 190 570 170 548 Z" />
        <path d="M 130 532 C 152 545 168 572 170 600 C 155 585 140 565 120 548 Z" />
        <path d="M 80 538 C 100 550 115 572 118 595 C 105 582 90 565 72 552 Z" />
        <path d="M 35 548 C 52 558 65 575 68 590 C 55 580 42 568 28 558 Z" />
      </g>

      <!-- Paw Toes -->
      <path d="M -10 560 C -15 575 -10 590 5 600 C 20 605 35 600 45 590 C 35 580 25 570 -10 560 Z" fill="#FFF8F0" />
      <path d="M 2 575 Q -5 585 5 595" stroke="#D0C0B0" stroke-width="2" fill="none" />
      <path d="M 15 570 Q 10 582 20 595" stroke="#D0C0B0" stroke-width="2" fill="none" />
    </g>

    <!-- CAT HEAD -->
    <g id="head">
      <path d="M 250 300 C 200 340 220 420 280 450 C 340 480 420 460 450 400 C 480 340 450 260 380 240 C 320 220 280 250 250 300 Z" fill="url(#gingerFur)" />

      <!-- Lower Face / Muzzle White Fur -->
      <path d="M 230 360 C 210 410 250 460 310 470 C 370 480 430 450 440 390 C 420 420 370 450 310 440 C 260 430 235 390 230 360 Z" fill="url(#whiteFur)" />
      <path d="M 260 340 C 240 380 260 430 310 440 C 360 450 400 410 410 360 C 390 400 350 425 310 420 C 270 415 250 380 260 340 Z" fill="#FFFFFF" />

      <!-- Ginger Calico Patch on Temple -->
      <path d="M 340 245 C 400 250 460 300 440 370 C 420 330 380 280 340 245 Z" fill="#E27D38" />

      <!-- Tabby Forehead Markings -->
      <g fill="url(#darkStripe)">
        <path d="M 310 240 L 320 265 L 330 242 L 340 268 L 350 245 C 338 258 332 258 330 250 C 328 258 322 258 310 240 Z" />
        <path d="M 285 260 C 300 270 315 285 310 295 C 300 288 290 275 278 265 Z" />
        <path d="M 365 255 C 375 270 380 288 372 298 C 368 288 362 272 355 260 Z" />
        <path d="M 300 230 C 315 235 330 235 345 230 C 335 238 320 238 300 230 Z" />
      </g>

      <!-- LEFT EAR -->
      <g id="left-ear">
        <path d="M 280 240 L 220 110 C 210 90 230 90 250 110 L 330 210 Z" fill="#D97332" />
        <path d="M 275 230 L 230 120 C 225 110 235 110 245 125 L 315 210 Z" fill="url(#pinkEar)" />
        <path d="M 270 235 Q 240 180 285 170" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M 280 240 Q 250 190 295 185" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M 260 225 Q 235 160 270 150" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- RIGHT EAR -->
      <g id="right-ear">
        <path d="M 370 220 L 530 40 C 550 20 570 40 550 70 L 440 250 Z" fill="#C85E1B" />
        <path d="M 530 40 C 550 20 570 40 550 70 L 520 120 C 535 80 535 50 530 40 Z" fill="url(#darkStripe)" />
        <path d="M 385 215 L 525 60 C 535 48 542 60 530 80 L 430 240 Z" fill="url(#pinkEar)" />
        <path d="M 390 220 C 420 170 470 120 505 100" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
        <path d="M 400 230 C 440 180 480 140 520 110" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
        <path d="M 380 210 C 410 160 450 110 480 80" stroke="#FFF0E6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M 420 235 C 450 200 485 160 510 135" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- CLOSED SLEEPING EYES -->
      <g id="eyes">
        <path d="M 270 315 C 285 300 315 300 330 318" stroke="#A86038" stroke-width="3" fill="none" stroke-linecap="round" />
        <path d="M 268 318 C 285 332 315 332 332 318" stroke="#23120B" stroke-width="4.5" fill="none" stroke-linecap="round" />
        <path d="M 268 318 L 262 314" stroke="#23120B" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 273 322 L 269 327" stroke="#23120B" stroke-width="2" stroke-linecap="round" />
        <path d="M 332 318 L 338 314" stroke="#23120B" stroke-width="2.5" stroke-linecap="round" />

        <path d="M 370 325 C 385 310 410 312 425 330" stroke="#A86038" stroke-width="3" fill="none" stroke-linecap="round" />
        <path d="M 368 328 C 385 342 410 342 427 328" stroke="#23120B" stroke-width="4.5" fill="none" stroke-linecap="round" />
        <path d="M 427 328 L 433 324" stroke="#23120B" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 368 328 L 362 324" stroke="#23120B" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- NOSE & SNOUT -->
      <g id="nose-and-snout">
        <path d="M 330 280 L 320 335 L 340 335 Z" fill="#D8926A" opacity="0.3" />
        <path d="M 315 335 C 315 330 345 330 345 335 C 345 345 335 355 330 355 C 325 355 315 345 315 335 Z" fill="url(#pinkEar)" />
        <ellipse cx="325" cy="336" rx="4" ry="2" fill="#FFFFFF" opacity="0.7" />
        <path d="M 322 347 C 326 350 334 350 338 347" stroke="#B04840" stroke-width="2" fill="none" stroke-linecap="round" />

        <path d="M 330 355 L 330 363 C 320 370 305 370 295 362" stroke="#B57A5C" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <path d="M 330 363 C 340 370 355 370 365 362" stroke="#B57A5C" stroke-width="2.5" fill="none" stroke-linecap="round" />

        <circle cx="305" cy="352" r="1.5" fill="#8C5238"/>
        <circle cx="295" cy="356" r="1.5" fill="#8C5238"/>
        <circle cx="300" cy="362" r="1.5" fill="#8C5238"/>
        <circle cx="355" cy="352" r="1.5" fill="#8C5238"/>
        <circle cx="365" cy="356" r="1.5" fill="#8C5238"/>
        <circle cx="360" cy="362" r="1.5" fill="#8C5238"/>
      </g>

      <!-- FINE WHITE WHISKERS -->
      <g id="whiskers" stroke="#FFFFFF" stroke-linecap="round" opacity="0.9">
        <path d="M 290 358 C 220 360 150 340 90 310" stroke-width="2.5" />
        <path d="M 288 362 C 210 375 140 370 70 350" stroke-width="2.5" />
        <path d="M 292 368 C 230 390 160 400 100 395" stroke-width="2" />
        <path d="M 295 372 C 240 405 180 425 120 430" stroke-width="1.8" />

        <path d="M 365 358 C 440 355 520 340 590 320" stroke-width="2.5" />
        <path d="M 368 362 C 450 370 530 365 610 350" stroke-width="2.5" />
        <path d="M 364 368 C 440 385 510 395 580 390" stroke-width="2" />
        <path d="M 360 372 C 430 400 490 420 550 425" stroke-width="1.8" />

        <path d="M 295 275 C 260 240 230 200 210 160" stroke-width="1.8" />
        <path d="M 305 270 C 280 230 255 180 240 130" stroke-width="1.5" />
        <path d="M 360 270 C 390 230 420 180 440 130" stroke-width="1.8" />
      </g>

    </g>
  </g>

  <!-- Warm Sun Glow & Atmospheric Flare -->
  <rect width="800" height="800" fill="url(#sunGlow)" pointer-events="none" style="mix-blend-mode: overlay;" />

  <g fill="#FFFFFF" opacity="0.2" pointer-events="none">
    <circle cx="150" cy="120" r="40" />
    <circle cx="220" cy="180" r="20" />
    <circle cx="680" cy="150" r="50" />
  </g>
</svg>
